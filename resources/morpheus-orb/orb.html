<!doctype html>
<html lang="en" data-state="armed" data-hover="false">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Morpheus presence</title>
  <link rel="stylesheet" href="orb.css">
</head>
<body>
  <form class="hover-composer" inert aria-label="Morpheus command">
    <label class="sr-only" for="orb-input">Morpheus</label>
    <input id="orb-input" type="text" autocomplete="off" spellcheck="true" maxlength="4000" placeholder="Ask Morpheus…" disabled>
    <button class="hover-composer-send" type="submit" aria-label="Send" title="Send" disabled>↗</button>
    <button class="hover-composer-expand" type="button" aria-label="Open compact conversation" title="Open compact conversation">⤢</button>
  </form>
  <button class="orb" type="button" aria-label="Ask Morpheus" title="Ask Morpheus">
    <img src="orb.png" alt="" draggable="false">
  </button>
  <div id="orb-status" class="sr-only" role="status" aria-live="polite"></div>
  <script src="orb.js" defer></script>
</body>
</html>
