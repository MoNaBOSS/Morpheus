<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Morpheus">
  <title>Morpheus</title>
  <desc>Original Morpheus mark: a geometric M whose converging strokes resolve into a single downward execution stroke.</desc>

  <defs>
    <!-- Deep slate base. Matrix influence is an accent, not the whole surface. -->
    <linearGradient id="mSurface" gradientUnits="userSpaceOnUse" x1="256" y1="0" x2="256" y2="512">
      <stop offset="0" stop-color="#141B20"/>
      <stop offset="1" stop-color="#070A0C"/>
    </linearGradient>

    <!-- userSpaceOnUse throughout: an axis-aligned stroke has a zero-width
         bounding box, which collapses an objectBoundingBox gradient and makes
         the stroke disappear entirely. -->
    <linearGradient id="mStroke" gradientUnits="userSpaceOnUse" x1="120" y1="150" x2="392" y2="330">
      <stop offset="0" stop-color="#8CF7CB"/>
      <stop offset="0.5" stop-color="#34D399"/>
      <stop offset="1" stop-color="#0E9C70"/>
    </linearGradient>

    <linearGradient id="mExec" gradientUnits="userSpaceOnUse" x1="256" y1="300" x2="256" y2="392">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0.05"/>
    </linearGradient>

    <radialGradient id="mGlow" gradientUnits="userSpaceOnUse" cx="256" cy="215" r="280">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Container -->
  <rect width="512" height="512" rx="114" fill="url(#mSurface)"/>
  <rect width="512" height="512" rx="114" fill="url(#mGlow)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="112.5" fill="none"
        stroke="#34D399" stroke-opacity="0.18" stroke-width="3"/>

  <!-- The M: two uprights and two diagonals converging on a centre vertex.
       The convergence is the point — many inputs resolving to one action. -->
  <g fill="none" stroke="url(#mStroke)" stroke-width="36"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M 142 364 L 142 156"/>
    <path d="M 370 364 L 370 156"/>
    <path d="M 142 156 L 256 286"/>
    <path d="M 370 156 L 256 286"/>
  </g>

  <!-- Execution stroke: the resolved action descending from the vertex. -->
  <path d="M 256 300 L 256 384" stroke="url(#mExec)" stroke-width="18" stroke-linecap="round"/>

  <!-- Three measured ticks: discrete, audited steps rather than a continuous stream. -->
  <g fill="#34D399">
    <circle cx="256" cy="410" r="7.5" fill-opacity="0.9"/>
    <circle cx="211" cy="410" r="5" fill-opacity="0.42"/>
    <circle cx="301" cy="410" r="5" fill-opacity="0.42"/>
  </g>
</svg>
