name: Morpheus Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build without publishing. Leave empty for the selected branch.'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Morpheus source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Bind tested checkout and release channel
        id: channel
        shell: pwsh
        run: |
          $source = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Unable to bind tested source.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # Every SemVer prerelease, including preview, stays a prerelease.
          $stable = $version -match '^\d+\.\d+\.\d+(?:\+[0-9A-Za-z.-]+)?$'
          "stable=$($stable.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "source=$source" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Prefer HTTPS for public GitHub dependencies
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        run: node scripts/assert-tag-matches-package.mjs

      - name: Require explicit Morpheus signing configuration
        if: steps.channel.outputs.stable == 'true'
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.MORPHEUS_SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.MORPHEUS_SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY_SLUG: ${{ vars.MORPHEUS_SIGNPATH_POLICY_SLUG }}
          MORPHEUS_EXPECTED_PUBLISHER: ${{ vars.MORPHEUS_EXPECTED_PUBLISHER }}
        run: node scripts/windows/public-release-policy.mjs --configuration

      - name: Verify dependency remediation and audit the complete tree
        run: pnpm run security:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint:check -- --quiet

      - name: Run full unit suite
        run: pnpm test

      - name: Validate runtime harness
        run: pnpm run harness:ci

      - name: Check communication regressions
        run: |
          pnpm run comms:replay
          pnpm run comms:compare

      - name: Build renderer for Electron journeys
        run: pnpm run build:vite

      - name: Run focused Electron release journeys
        run: pnpm exec playwright test tests/e2e/morpheus-fluid-arrival.spec.ts tests/e2e/morpheus-intelligence-voice.spec.ts tests/e2e/morpheus-update-status.spec.ts tests/e2e/morpheus-signal-os.spec.ts --workers=1

      - name: Build Windows installer
        run: pnpm run package:win

      - name: Validate signed application payload before outer signing
        if: steps.channel.outputs.stable == 'true'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.MORPHEUS_SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.MORPHEUS_SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY_SLUG: ${{ vars.MORPHEUS_SIGNPATH_POLICY_SLUG }}
          MORPHEUS_EXPECTED_PUBLISHER: ${{ vars.MORPHEUS_EXPECTED_PUBLISHER }}
        run: |
          $installers = @(Get-ChildItem release -Filter 'Morpheus-*-win-x64.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one Morpheus x64 installer, found $($installers.Count)." }
          ./scripts/windows/assert-public-signatures.ps1 -Stage payload -ExpectedSource '${{ steps.channel.outputs.source }}'

      - name: Upload unsigned installer for SignPath
        if: steps.channel.outputs.stable == 'true'
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-morpheus-win-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/Morpheus-*-win-x64.exe
          retention-days: 1

      - name: Sign stable installer with SignPath
        if: steps.channel.outputs.stable == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.MORPHEUS_SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.MORPHEUS_SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.MORPHEUS_SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release/signed

      - name: Install final signed artifact
        if: steps.channel.outputs.stable == 'true'
        shell: pwsh
        run: |
          $signed = @(Get-ChildItem release/signed -Filter 'Morpheus-*-win-x64.exe' -File -Recurse)
          if ($signed.Count -ne 1) { throw "Expected one signed Morpheus installer, found $($signed.Count)." }
          $expected = 'Morpheus-${{ steps.channel.outputs.version }}-win-x64.exe'
          if ($signed[0].Name -cne $expected) { throw 'Signed installer filename/version mismatch.' }
          Copy-Item -LiteralPath $signed[0].FullName -Destination "release/$expected" -Force

      - name: Verify final publisher and embedded signed application
        if: steps.channel.outputs.stable == 'true'
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.MORPHEUS_SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.MORPHEUS_SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY_SLUG: ${{ vars.MORPHEUS_SIGNPATH_POLICY_SLUG }}
          MORPHEUS_EXPECTED_PUBLISHER: ${{ vars.MORPHEUS_EXPECTED_PUBLISHER }}
        run: ./scripts/windows/assert-public-signatures.ps1 -Stage final -ExpectedSource '${{ steps.channel.outputs.source }}'

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release -Filter 'Morpheus-*-win-x64.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one final installer, found $($installers.Count)." }
          $hash = Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256
          "$($hash.Hash)  $($installers[0].Name)" | Set-Content release/SHA256SUMS-windows.txt

      - name: Upload verified Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: morpheus-windows-${{ steps.channel.outputs.version }}
          path: |
            release/Morpheus-*-win-x64.exe
            release/SHA256SUMS-windows.txt
            release/public-signing-verification.json
          if-no-files-found: error
          retention-days: 14

      - name: Create Morpheus draft for release review
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Morpheus-*-win-x64.exe
            release/SHA256SUMS-windows.txt
            release/public-signing-verification.json
          draft: true
          prerelease: ${{ steps.channel.outputs.stable != 'true' }}
          make_latest: false
          generate_release_notes: true
          body: |
            ## Morpheus ${{ github.ref_name }} for Windows

            Morpheus is an AI execution platform and persistent personal operator.

            Download `Morpheus-${{ steps.channel.outputs.version }}-win-x64.exe` and verify it against `SHA256SUMS-windows.txt`.

            Morpheus auto-update remains disabled until a dedicated Morpheus-owned update endpoint is configured. OpenClaw remains the embedded Chat runtime; it is not the product identity or execution authority.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# A Morpheus release must never publish to the inherited ClawX OSS bucket.
# Dedicated update hosting will be added together with signed-update verification.
# No .blockmap or update manifest is uploaded: post-package signing changes bytes.
# Public publication is intentionally manual. See docs/releases/PUBLIC-RELEASE-GATES.md.
