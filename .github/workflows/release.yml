name: Morpheus Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build without publishing. Leave empty for the selected branch.'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Morpheus source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Prefer HTTPS for public GitHub dependencies
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        run: node scripts/assert-tag-matches-package.mjs

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint:check -- --quiet

      - name: Run Morpheus unit tests
        shell: pwsh
        run: |
          $tests = Get-ChildItem tests/unit -Filter 'morpheus-*.test.ts' | ForEach-Object { $_.FullName }
          if (-not $tests) { throw 'No Morpheus unit tests were found.' }
          pnpm exec vitest run $tests

      - name: Build Windows installer
        run: pnpm run package:win

      - name: Detect release channel
        id: channel
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $stable = $version -notmatch '-(alpha|beta|rc)'
          "stable=$($stable.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Validate unsigned installer before signing
        if: startsWith(github.ref, 'refs/tags/v') && steps.channel.outputs.stable == 'true'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release -Filter 'Morpheus-*-win-x64.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one Morpheus x64 installer, found $($installers.Count)." }

      - name: Upload unsigned installer for SignPath
        if: startsWith(github.ref, 'refs/tags/v') && steps.channel.outputs.stable == 'true'
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-morpheus-win-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/Morpheus-*-win-x64.exe
          retention-days: 1

      - name: Sign stable installer with SignPath
        if: startsWith(github.ref, 'refs/tags/v') && steps.channel.outputs.stable == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: '78e37079-23df-4800-b41c-33312ad7c1e3'
          project-slug: 'ValueCell'
          signing-policy-slug: 'ValueCell-sign'
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release/signed

      - name: Install signed artifact and refresh update metadata
        if: startsWith(github.ref, 'refs/tags/v') && steps.channel.outputs.stable == 'true'
        shell: pwsh
        run: |
          $signed = @(Get-ChildItem release/signed -Filter 'Morpheus-*-win-x64.exe' -File -Recurse)
          if ($signed.Count -ne 1) { throw "Expected one signed Morpheus installer, found $($signed.Count)." }
          Copy-Item -LiteralPath $signed[0].FullName -Destination "release/$($signed[0].Name)" -Force

          $installer = Get-Item "release/$($signed[0].Name)"
          $hash = Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA512
          $hashBytes = [byte[]]::new($hash.Hash.Length / 2)
          for ($i = 0; $i -lt $hashBytes.Length; $i++) {
            $hashBytes[$i] = [Convert]::ToByte($hash.Hash.Substring($i * 2, 2), 16)
          }
          $sha512 = [Convert]::ToBase64String($hashBytes)
          $escapedName = [Regex]::Escape($installer.Name)
          foreach ($manifest in Get-ChildItem release -Filter '*.yml' -File | Where-Object Name -ne 'builder-debug.yml') {
            $content = Get-Content $manifest.FullName -Raw
            $content = $content -replace "(?m)(url:\s*$escapedName\s*\r?\n\s*sha512:\s*)\S+(\s*\r?\n\s*size:\s*)\d+", "`${1}$sha512`${2}$($installer.Length)"
            $content = $content -replace "(?m)(path:\s*$escapedName\s*\r?\n)sha512:\s*\S+", "`${1}sha512: $sha512"
            Set-Content -LiteralPath $manifest.FullName -Value $content -NoNewline
          }

      - name: Verify stable Authenticode signature
        if: startsWith(github.ref, 'refs/tags/v') && steps.channel.outputs.stable == 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter 'Morpheus-*-win-x64.exe' -File | Select-Object -First 1
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Authenticode status is $($signature.Status), expected Valid." }

      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release -Filter 'Morpheus-*-win-x64.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one final installer, found $($installers.Count)." }
          $hash = Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256
          "$($hash.Hash)  $($installers[0].Name)" | Set-Content release/SHA256SUMS-windows.txt

      - name: Upload verified Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: morpheus-windows-${{ steps.channel.outputs.version }}
          path: |
            release/Morpheus-*-win-x64.exe
            release/Morpheus-*-win-x64.exe.blockmap
            release/latest.yml
            release/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish Morpheus GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Morpheus-*-win-x64.exe
            release/Morpheus-*-win-x64.exe.blockmap
            release/latest.yml
            release/SHA256SUMS-windows.txt
          draft: false
          prerelease: ${{ steps.channel.outputs.stable != 'true' }}
          make_latest: ${{ steps.channel.outputs.stable == 'true' }}
          generate_release_notes: true
          body: |
            ## Morpheus ${{ github.ref_name }} for Windows

            Morpheus is an AI execution platform and persistent personal operator.

            Download `Morpheus-${{ steps.channel.outputs.version }}-win-x64.exe` and verify it against `SHA256SUMS-windows.txt`.

            Morpheus auto-update remains disabled until a dedicated Morpheus-owned update endpoint is configured. OpenClaw remains the embedded Chat runtime; it is not the product identity or execution authority.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# A Morpheus release must never publish to the inherited ClawX OSS bucket.
# Dedicated update hosting will be added together with signed-update verification.
